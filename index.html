<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение в кино</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Левая часть: Превью -->
        <div class="image-section">
            <!-- Замените poster.jpg на имя вашего файла с постером -->
            <img src="images.jpeg" alt="Постер фильма" class="poster">
        </div>
        
        <!-- Правая часть: Текст с градиентом -->
        <div class="text-section">
            <div class="text-content">
                <h1>Приглашаю тебя в кино!</h1>
                <p>Здесь будет ваш текст. Например: «Жду тебя 25 октября в 19:00. Будет красиво!»</p>
            </div>
        </div>
    </div>
</body>
</html>
